syntax = "proto3";

package frequenz.api.common.v1alpha8.gridpool;


// Gridpool contains details of a specific Gridpool.
//
// A Gridpool is a virtual balancing and operating pool. It groups Market
// Locations, Microgrids, and Microgrid-to-Market-Location links that are
// managed together by applications for trading, balancing, forecasting,
// reporting, settlement, flexibility, and related services.
//
// A Gridpool is not a physical site and does not imply a single delivery area.
// Members of the same Gridpool may belong to different delivery areas.
//
// The members and services configured for a Gridpool are modeled as separate
// resources by APIs that expose Gridpool topology and service configuration.
//
message Gridpool {
  // Unique identifier of the Gridpool.
  uint64 id = 1;

  /// Human-readable name of the Gridpool.
  string name = 2;
}
